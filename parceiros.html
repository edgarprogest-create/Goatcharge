<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Parceiros · Goat Spaces</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0b">
<meta name="description" content="Leva a Goat Spaces para o teu negócio. Parceiro de espaço sem investimento, franchisado a partir de 800€ ou marca própria a partir de 1.700€.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{--ink:#0d0d0b;--ink2:#161614;--bone:#F4F2E9;--bone2:rgba(244,242,233,0.72);--bone3:rgba(244,242,233,0.5);--line:rgba(244,242,233,0.08);--line2:rgba(244,242,233,0.14);--acc:#D4FF3D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:var(--acc)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bone3)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.bolt{width:30px;height:30px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.langs{display:flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:99px}
.langs button{border:0;background:transparent;color:var(--bone2);font:600 10px 'JetBrains Mono',monospace;letter-spacing:.08em;padding:6px 10px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--bone);color:var(--ink)}
.hero{position:relative;border-radius:24px;overflow:hidden;padding:64px 28px 40px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(90deg,#0d0d0b 0%,#0d0d0b 43%,rgba(13,13,11,.75) 52%,rgba(13,13,11,.35) 70%,rgba(13,13,11,.1) 100%),url("assets/goat-welcome.jpg") right 34%/60% auto no-repeat,#0d0d0b}
@media (max-width:640px){.hero{background:linear-gradient(90deg,rgba(13,13,11,.92) 0%,rgba(13,13,11,.6) 60%,rgba(13,13,11,.25) 100%),linear-gradient(0deg,rgba(13,13,11,.8),rgba(13,13,11,0) 60%),url("assets/goat-welcome.jpg") 70% 30%/cover no-repeat,#0d0d0b}}
h1{font-size:clamp(34px,6vw,58px);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin:12px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
.lead{font-size:16px;line-height:1.5;color:var(--bone2);max-width:520px;margin:0;text-wrap:pretty}
h2{font-size:26px;font-weight:500;letter-spacing:-.025em;margin:0 0 18px}
section{padding:44px 0 0}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.plan{border:1px solid var(--line2);background:var(--ink2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.plan.hl{border-color:rgba(212,255,61,.4);background:linear-gradient(180deg,rgba(212,255,61,.06),rgba(212,255,61,0) 60%),var(--ink2)}
.price{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.plan.hl .price{color:var(--acc)}
.note{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--bone2);margin-top:6px}
.tag{font-size:14px;color:var(--bone2);margin-top:4px}
.for{font-size:14px;line-height:1.5;color:var(--bone2);margin:0;text-wrap:pretty}
.sep{height:1px;background:var(--line)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
li svg{flex-shrink:0;margin-top:3px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.perk{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.perk b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.perk span{font-size:13.5px;line-height:1.45;color:var(--bone2)}
.contact{margin:44px 0 40px;border-radius:24px;border:1px solid var(--line2);padding:26px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.contact h2{margin:0 0 6px}
.contact p{margin:0;color:var(--bone2);font-size:14.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line2);transition:scale .2s cubic-bezier(.34,1.56,.64,1)}
.btn:active{scale:.96}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.pri:hover{color:var(--ink);filter:brightness(1.05)}
footer{padding:0 0 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 60% 80% at 72% 40%,rgba(13,13,11,0) 0%,#0d0d0b 70%),#0d0d0b;animation:goatReveal 2.2s cubic-bezier(.22,.8,.2,1) .15s both;pointer-events:none}
@keyframes goatReveal{0%{opacity:1}35%{opacity:.85}100%{opacity:0}}
.hero .mono,.hero h1,.hero .lead{animation:riseIn .9s cubic-bezier(.22,.8,.2,1) both}
.hero .mono{animation-delay:1.1s}.hero h1{animation-delay:1.25s}.hero .lead{animation-delay:1.4s}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section,.contact{animation:riseIn .9s cubic-bezier(.22,.8,.2,1) 1.6s both}
@media (prefers-reduced-motion:reduce){.hero::after,.hero .mono,.hero h1,.hero .lead,section,.contact{animation:none}.hero::after{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="brand" href="./"><span class="bolt"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M14 2 5 14h6l-1 8 9-12h-6z" fill="#0d0d0b"></path></svg></span>Goat Spaces</a>
<div class="langs"><button data-l="pt">PT</button><button data-l="en">EN</button><button data-l="es">ES</button></div>
</header>
<div class="hero">
<div class="mono" data-t="over"></div>
<h1 data-t="h1"></h1>
<p class="lead" data-t="lead"></p>
</div>
<section>
<div class="mono" style="margin-bottom:8px" data-t="mOver"></div>
<h2 data-t="mTitle"></h2>
<div class="plans">
<div class="plan hl">
<div><div class="mono" data-t="p1n"></div><div class="price" style="margin-top:8px">0€</div><div class="tag" data-t="p1t"></div></div>
<p class="for" data-t="p1f"></p>
<div class="sep"></div>
<ul data-list="p1"></ul>
</div>
<div class="plan">
<div><div class="mono" data-t="p2n"></div><div class="price" style="margin-top:8px" data-t="p2p"></div><div class="tag" data-t="p2t"></div></div>
<p class="for" data-t="p2f"></p>
<div class="sep"></div>
<ul data-list="p2"></ul>
</div>
<div class="plan">
<div><div class="mono" data-t="p3n"></div><div class="price" style="margin-top:8px" data-t="p3p"></div><div class="note" data-t="p3x"></div></div>
<p class="for" data-t="p3f"></p>
<div class="sep"></div>
<ul data-list="p3"></ul>
</div>
</div>
</section>
<section>
<h2 data-t="incTitle"></h2>
<div class="perks" data-perks></div>
</section>
<div class="contact">
<div><h2 data-t="cTitle"></h2><p data-t="cBody"></p></div>
<div class="btns">
<a class="btn pri" id="mail" href="mailto:goatenergypartners@gmail.com"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m4 7 8 6 8-6"></path></svg>Email</a>
<a class="btn" href="tel:+351913523088"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>913 523 088</a>
</div>
</div>
<footer><span class="mono">goatcharge.com</span><span class="mono" data-t="eu"></span></footer>
</div>
<script>
const T={
pt:{over:'Goat Spaces · parceiros',h1:'Leva a Goat Spaces para <em>o teu negócio.</em>',lead:'Estações de powerbanks para cafés, bares, ginásios, hotéis e eventos. Escolhe o modelo que faz sentido para ti.',mOver:'Três modelos',mTitle:'Como queres começar?',
p1n:'Parceiro de espaço',p1t:'Sem investimento',p1f:'Tens o espaço e o público. Nós trazemos a estação e tratamos de tudo.',p1:['Comissão por cada aluguer','Máquina, instalação e manutenção por nossa conta','Assistência 24h/7d por semana'],
p2n:'Franchisado',p2p:'a partir de 800€',p2t:'A máquina é tua',p2f:'Investes nas estações, colocas onde quiseres e crias o teu próprio rendimento.',p2:['Ficas com a maior parte da faturação','Equipa de IT incluída sem custos','Assistência 24h/7d por semana'],
p3n:'Marca própria',p3p:'a partir de 1.700€',p3x:'+ máquinas, a partir de 800€ cada',p3f:'Lança a tua própria marca de powerbanks. Nós damos a tecnologia, tu dás o nome.',p3:['O teu nome, logótipo, cores e domínio','Plataforma, pagamentos e painel de gestão','Equipa de IT e assistência 24h/7d'],
incTitle:'Incluído em todos os modelos',perks:[['Pagamentos automáticos','Cartão via Stripe, cobrança por hora e reembolso automático.'],['Equipa de IT','Software, atualizações e monitorização sem custos.'],['Assistência 24h/7d','Estamos disponíveis sempre que precisares.'],['Toda a Europa','Disponível para toda a Europa.']],
cTitle:'Fala connosco',cBody:'Respondemos no próprio dia.',subj:'Parceria Goat Spaces',eu:'Disponível para toda a Europa'},
en:{over:'Goat Spaces · partners',h1:'Bring Goat Spaces to <em>your venue.</em>',lead:'Powerbank stations for cafés, bars, gyms, hotels and events. Pick the model that works for you.',mOver:'Three models',mTitle:'How do you want to start?',
p1n:'Venue partner',p1t:'No investment',p1f:'You have the space and the crowd. We bring the station and handle everything.',p1:['Commission on every rental','Station, installation and maintenance on us','24/7 support'],
p2n:'Franchisee',p2p:'from €800',p2t:'You own the station',p2f:'Invest in stations, place them wherever you like and build your own income.',p2:['Keep most of the revenue','IT team included at no cost','24/7 support'],
p3n:'Your own brand',p3p:'from €1,700',p3x:'+ stations, from €800 each',p3f:'Launch your own powerbank brand. We provide the technology, you provide the name.',p3:['Your name, logo, colours and domain','Platform, payments and management dashboard','IT team and 24/7 support'],
incTitle:'Included in every model',perks:[['Automatic payments','Card via Stripe, hourly billing and automatic refunds.'],['IT team','Software, updates and monitoring at no cost.'],['24/7 support','We are available whenever you need us.'],['All of Europe','Available across Europe.']],
cTitle:'Talk to us',cBody:'We reply the same day.',subj:'Goat Spaces partnership',eu:'Available across Europe'},
es:{over:'Goat Spaces · socios',h1:'Lleva Goat Spaces a <em>tu negocio.</em>',lead:'Estaciones de powerbanks para cafeterías, bares, gimnasios, hoteles y eventos. Elige el modelo que mejor te encaje.',mOver:'Tres modelos',mTitle:'¿Cómo quieres empezar?',
p1n:'Socio de espacio',p1t:'Sin inversión',p1f:'Tú tienes el espacio y el público. Nosotros traemos la estación y nos encargamos de todo.',p1:['Comisión por cada alquiler','Máquina, instalación y mantenimiento a nuestro cargo','Asistencia 24h/7d'],
p2n:'Franquiciado',p2p:'desde 800€',p2t:'La máquina es tuya',p2f:'Inviertes en estaciones, las colocas donde quieras y creas tu propio ingreso.',p2:['Te quedas con la mayor parte de la facturación','Equipo de IT incluido sin coste','Asistencia 24h/7d'],
p3n:'Marca propia',p3p:'desde 1.700€',p3x:'+ máquinas, desde 800€ cada una',p3f:'Lanza tu propia marca de powerbanks. Nosotros ponemos la tecnología, tú pones el nombre.',p3:['Tu nombre, logotipo, colores y dominio','Plataforma, pagos y panel de gestión','Equipo de IT y asistencia 24h/7d'],
incTitle:'Incluido en todos los modelos',perks:[['Pagos automáticos','Tarjeta con Stripe, cobro por hora y reembolso automático.'],['Equipo de IT','Software, actualizaciones y monitorización sin coste.'],['Asistencia 24h/7d','Estamos disponibles siempre que nos necesites.'],['Toda Europa','Disponible en toda Europa.']],
cTitle:'Habla con nosotros',cBody:'Respondemos el mismo día.',subj:'Colaboración Goat Spaces',eu:'Disponible en toda Europa'}};
const tick='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D4FF3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
function setLang(l){const t=T[l];document.documentElement.lang=l;
document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t[e.dataset.t]);
document.querySelectorAll('[data-list]').forEach(e=>e.innerHTML=t[e.dataset.list].map(v=>'<li>'+tick+'<span>'+v+'</span></li>').join(''));
document.querySelector('[data-perks]').innerHTML=t.perks.map(p=>'<div class="perk"><b>'+p[0]+'</b><span>'+p[1]+'</span></div>').join('');
document.getElementById('mail').href='mailto:goatenergypartners@gmail.com?subject='+encodeURIComponent(t.subj);
document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
try{localStorage.setItem('goat_partner_lang',l)}catch(e){}}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const n=(navigator.language||'pt').toLowerCase();
let saved=null;try{saved=localStorage.getItem('goat_partner_lang')}catch(e){}
setLang(saved||(n.startsWith('pt')?'pt':n.startsWith('es')?'es':'en'));
</script>
</body>
</html>
