h1{font-size:clamp(34px,6vw,58px);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin:12px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
.lead{font-size:16px;line-height:1.5;color:var(--bone2);max-width:520px;margin:0;text-wrap:pretty}
h2{font-size:26px;font-weight:500;letter-spacing:-.025em;margin:0 0 18px}
section{padding:44px 0 0}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.plan{border:1px solid var(--line2);background:var(--ink2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.plan.hl{border-color:rgba(212,255,61,.4);background:linear-gradient(180deg,rgba(212,255,61,.06),rgba(212,255,61,0) 60%),var(--ink2)}
.price{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.plan.hl .price{color:var(--acc)}
.note{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--bone2);margin-top:6px}
.tag{font-size:14px;color:var(--bone2);margin-top:4px}
.for{font-size:14px;line-height:1.5;color:var(--bone2);margin:0;text-wrap:pretty}
.sep{height:1px;background:var(--line)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
li svg{flex-shrink:0;margin-top:3px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.perk{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.perk b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.perk span{font-size:13.5px;line-height:1.45;color:var(--bone2)}
.contact{margin:44px 0 40px;border-radius:24px;border:1px solid var(--line2);padding:26px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.contact h2{margin:0 0 6px}
.contact p{margin:0;color:var(--bone2);font-size:14.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line2);transition:scale .2s cubic-bezier(.34,1.56,.64,1)}
.btn:active{scale:.96}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.pri:hover{color:var(--ink);filter:brightness(1.05)}
footer{padding:0 0 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:0;z-index:0;opacity:0;background:radial-gradient(ellipse 60% 80% at 72% 40%,rgba(13,13,11,0) 0%,#0d0d0b 70%),#0d0d0b;animation:goatReveal 2.2s cubic-bezier(.22,.8,.2,1) .15s both;pointer-events:none}
@keyframes goatReveal{0%{opacity:1}35%{opacity:.85}100%{opacity:0}}
.hero .mono,.hero h1,.hero .lead{animation:riseIn .9s cubic-bezier(.22,.8,.2,1) both}
.hero .mono{animation-delay:1.1s}.hero h1{animation-delay:1.25s}.hero .lead{animation-delay:1.4s}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section,.contact{animation:riseIn .9s cubic-bezier(.22,.8,.2,1) 1.6s both}
@media (prefers-reduced-motion:reduce){.hero::after,.hero .mono,.hero h1,.hero .lead,section,.contact{animation:none}.hero::after{opacity:0}}
